# Kobuki Node Parameters
kobuki_node:
  ros__parameters:
    # Device configuration.
    # ⚠ The LD06 LiDAR adapter (Prolific PL2303, 067b:2303) ALSO enumerates as /dev/ttyUSB* —
    # ttyUSB0/1 ordering is a boot-time race. Pin BOTH devices by /dev/serial/by-id
    # (Kobuki = FTDI 0403:6001, serial AI02MPKH) so they can never swap. See config/ldlidar.yaml
    # for the LiDAR side.
    device_port: /dev/serial/by-id/usb-Yujin_Robot_iClebo_Kobuki_kobuki_AI02MPKH-if00-port0

    # Odometry
    odom_frame: odom
    base_frame: base_footprint
    publish_tf: true

    # Wheel parameters (Kobuki specifications)
    wheel_left_joint_name: wheel_left_joint
    wheel_right_joint_name: wheel_right_joint

    # Safety
    cmd_vel_timeout_sec: 0.6

    # Battery
    battery_capacity: 16.5
    battery_low: 14.0
    battery_dangerous: 13.2
